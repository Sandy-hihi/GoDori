name: Sync All Branches to Personal Fork

on:
  push:
    # /가 들어간 브랜치·태그도 포함합니다.
    branches:
      - '**'
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: sync-fork-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Sandy-hihi/GoDori' && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Organization Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false 
          # 모든 커밋 히스토리와 브랜치 정보를 가져옵니다.

      - name: Push All Branches to Personal Fork Repo
        shell: bash
        env:
          SYNC_REF: ${{ github.ref }}
          FORKED_REPO_TOKEN: ${{ secrets.FORKED_REPO_TOKEN }}
        run: bash .github/scripts/sync-fork.sh
