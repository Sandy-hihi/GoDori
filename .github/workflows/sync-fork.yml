name: Sync All Branches to Personal Fork

on:
  push:
    # 💡 모든 브랜치(*)로의 푸시와 태그(tags) 수정을 모두 감지합니다.
    branches:
      - '*'
    tags:
      - '*'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Organization Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false 
          # 모든 커밋 히스토리와 브랜치 정보를 가져옵니다.

      - name: Push All Branches to Personal Fork Repo
        run: |
          git config --global user.email "hgyngl@gmail.com"
          git config --global user.name "hgyngl"
          
          # 💡 '내_개인_계정_명'과 '내_포크_레포_이름'을 정확하게 수정하세요.
          git remote add fork https://x-access-token:${{ secrets.FORKED_REPO_TOKEN }}@github.com/hgyngl/GoDori.git
          
          # 현재 푸시가 일어난 특정 브랜치(또는 태그) 이름만 추출합니다.
          REF_NAME=${GITHUB_REF#refs/heads/}
          REF_NAME=${REF_NAME#refs/tags/}
          
          # 팀 레포에 푸시된 브랜치/태그 내용을 개인 포크 레포의 동일한 이름으로 강제 푸시합니다.
          git push fork HEAD:refs/heads/$REF_NAME --force --tags
